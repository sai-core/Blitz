<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1">
<title>BLITZ</title>
<style>
  :root{
    --bg:#0b0b0d; --panel:#141417; --panel2:#1c1c20;
    --red:#e50914; --text:#f3f3f3; --text-dim:#9a9aa0; --line:rgba(255,255,255,.08);
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
  html,body{margin:0;min-height:100%;background:var(--bg);color:var(--text);
    font-family:"Helvetica Neue",Arial,"Segoe UI",sans-serif;}

  .nav{display:flex;align-items:center;justify-content:space-between;padding:14px 28px;
    background:#0a0a0c;border-bottom:1px solid var(--line);}
  .brand{display:flex;align-items:center;gap:6px;font-weight:800;font-size:22px;letter-spacing:1px;}
  .brand .v{color:var(--red);font-size:26px;display:inline-block;animation:boltPulse 1.6s ease-in-out infinite;
    filter:drop-shadow(0 0 6px rgba(229,9,20,.7));}
  @keyframes boltPulse{
    0%,100%{transform:scale(1) rotate(0deg);filter:drop-shadow(0 0 4px rgba(229,9,20,.5));}
    45%{transform:scale(1.18) rotate(-6deg);filter:drop-shadow(0 0 12px rgba(229,9,20,.95));}
    55%{transform:scale(1.05) rotate(4deg);}
  }
  .brand b.shine{background:linear-gradient(100deg,var(--text) 40%,#fff 50%,var(--text) 60%);
    background-size:250% 100%;-webkit-background-clip:text;background-clip:text;color:transparent;
    animation:shineMove 3.2s linear infinite;}
  @keyframes shineMove{0%{background-position:200% 0;}100%{background-position:-200% 0;}}
  .admin-link{color:var(--text-dim);font-size:13px;text-decoration:none;border:1px solid var(--line);
    padding:8px 14px;border-radius:6px;}
  .admin-link:hover{color:var(--text);background:rgba(255,255,255,.08);}

  .content{padding:28px 32px 80px;max-width:1400px;margin:0 auto;}
  .row-head{display:flex;align-items:baseline;justify-content:space-between;margin:6px 0 18px;}
  .row-head h2{font-size:18px;margin:0;font-weight:700;}
  .row-head span{font-size:12px;color:var(--text-dim);}

  .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:14px;}
  .card{position:relative;height:124px;border-radius:8px;overflow:hidden;cursor:pointer;
    background:linear-gradient(135deg,#1f1f24,#101012);border:1px solid var(--line);
    transition:transform .2s ease, box-shadow .2s ease, border-color .2s;}
  .card:hover{transform:scale(1.04);box-shadow:0 12px 30px rgba(0,0,0,.6);border-color:rgba(255,255,255,.25);}
  .card .thumb{position:absolute;inset:0;background-size:cover;background-position:center;opacity:.9;}
  .card .fade{position:absolute;inset:0;background:linear-gradient(to top,rgba(0,0,0,.85),transparent 60%);}
  .card .title{position:absolute;left:10px;right:10px;bottom:8px;font-size:13px;font-weight:700;
    text-shadow:0 2px 6px rgba(0,0,0,.8);
    display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;}
  .card .play{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;
    opacity:0;transition:.2s;background:rgba(0,0,0,.2);}
  .card:hover .play{opacity:1;}
  .card .play svg{width:40px;height:40px;filter:drop-shadow(0 2px 8px rgba(0,0,0,.7));}

  .empty-hint,.err-hint{color:var(--text-dim);font-size:13px;padding:24px;border:1px dashed var(--line);
    border-radius:8px;text-align:center;}
  .loading{display:flex;justify-content:center;padding:50px 0;}
  .spinner{width:40px;height:40px;border-radius:50%;border:4px solid rgba(255,255,255,.15);
    border-top-color:var(--red);animation:spin .8s linear infinite;}
  @keyframes spin{to{transform:rotate(360deg);}}

  @media (max-width:640px){
    .nav{padding:12px 16px;}
    .content{padding:16px 16px 60px;}
    .grid{grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px;}
    .card{height:96px;}
  }
</style>
</head>
<body>

<div class="nav">
  <div class="brand"><span class="v">⚡</span><b class="shine">BLITZ</b></div>
  <a class="admin-link" href="admin.html">Admin</a>
</div>

<div class="content">
  <div class="row-head">
    <h2>All Videos</h2>
    <span id="countLabel"></span>
  </div>
  <div id="loading" class="loading"><div class="spinner"></div></div>
  <div id="grid" class="grid" style="display:none;"></div>
  <div id="emptyHint" class="empty-hint" style="display:none;">No videos yet. Add one from the Admin panel.</div>
  <div id="errHint" class="err-hint" style="display:none;">Couldn't load videos. Check back in a bit.</div>
</div>

<script>
(async function(){
  const grid = document.getElementById('grid');
  const loading = document.getElementById('loading');
  const emptyHint = document.getElementById('emptyHint');
  const errHint = document.getElementById('errHint');
  const countLabel = document.getElementById('countLabel');

  function escapeHtml(s){
    return (s||'').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
  }

  try{
    const res = await fetch('/api/videos');
    if(!res.ok) throw new Error('fetch failed');
    const videos = await res.json();

    loading.style.display = 'none';
    countLabel.textContent = videos.length + (videos.length===1 ? ' video' : ' videos');

    if(!videos.length){
      emptyHint.style.display = 'block';
      return;
    }

    grid.style.display = 'grid';
    grid.innerHTML = videos.map(v => `
      <div class="card" data-id="${escapeHtml(v.id)}">
        <div class="thumb" style="${v.thumb ? `background-image:url('${escapeHtml(v.thumb)}')` : `background:linear-gradient(135deg,#2a2a30,#111);`}"></div>
        <div class="fade"></div>
        <div class="play"><svg viewBox="0 0 24 24" fill="white"><path d="M8 5v14l11-7z"/></svg></div>
        <div class="title">${escapeHtml(v.title)}</div>
      </div>
    `).join('');

    grid.querySelectorAll('.card').forEach(card=>{
      card.addEventListener('click', ()=>{
        window.location.href = 'player.html?id=' + encodeURIComponent(card.dataset.id);
      });
    });
  }catch(e){
    loading.style.display = 'none';
    errHint.style.display = 'block';
  }
})();
</script>
</body>
</html>
