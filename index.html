<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1">
<title>BLITZ</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<script src="actors-config.js"></script>
<style>
  :root{
    --bg:#08080b; --bg2:#0e0e12; --panel:#151519; --panel2:#1b1b20;
    --red:#ff1f42; --spark:#ffd400; --text:#f5f5f7; --text-dim:#8c8c94; --line:rgba(255,255,255,.09);
    --font-display:'Space Grotesk',sans-serif; --font-body:'Inter',"Helvetica Neue",Arial,sans-serif;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
  html,body{margin:0;min-height:100%;color:var(--text);font-family:var(--font-body);
    background:
      radial-gradient(900px 500px at 15% -10%, rgba(255,31,66,.10), transparent 60%),
      radial-gradient(700px 500px at 100% 0%, rgba(255,212,0,.05), transparent 55%),
      var(--bg);
  }
  ::selection{background:var(--red);color:#fff;}
  ::-webkit-scrollbar{width:10px;height:10px;}
  ::-webkit-scrollbar-track{background:var(--bg);}
  ::-webkit-scrollbar-thumb{background:#28282f;border-radius:6px;}
  ::-webkit-scrollbar-thumb:hover{background:#38383f;}

  .nav{display:flex;align-items:center;justify-content:space-between;padding:16px 28px;
    background:rgba(9,9,11,.75);backdrop-filter:blur(14px) saturate(140%);
    border-bottom:1px solid var(--line);position:sticky;top:0;z-index:20;}
  .brand{display:flex;align-items:center;gap:7px;font-family:var(--font-display);font-weight:700;
    font-size:22px;letter-spacing:.5px;}
  .brand .v{color:var(--red);font-size:26px;display:inline-block;animation:boltPulse 1.8s ease-in-out infinite;
    filter:drop-shadow(0 0 7px rgba(255,31,66,.75));}
  @keyframes boltPulse{
    0%,100%{transform:scale(1) rotate(0deg);filter:drop-shadow(0 0 4px rgba(255,31,66,.5));}
    45%{transform:scale(1.18) rotate(-6deg);filter:drop-shadow(0 0 13px rgba(255,212,0,.85));}
    55%{transform:scale(1.05) rotate(4deg);}
  }
  .brand b.shine{background:linear-gradient(100deg,var(--text) 40%,#fff 50%,var(--text) 60%);
    background-size:250% 100%;-webkit-background-clip:text;background-clip:text;color:transparent;
    animation:shineMove 3.4s linear infinite;}
  @keyframes shineMove{0%{background-position:200% 0;}100%{background-position:-200% 0;}}
  .admin-link{color:var(--text-dim);font-size:13px;text-decoration:none;border:1px solid var(--line);
    padding:8px 14px;border-radius:7px;transition:.15s;font-weight:500;}
  .admin-link:hover{color:var(--text);background:rgba(255,255,255,.07);border-color:rgba(255,255,255,.18);}

  .content{padding:32px 32px 80px;max-width:1400px;margin:0 auto;}
  .row-head{display:flex;align-items:baseline;justify-content:space-between;margin:4px 0 20px;}
  .row-head h2{font-family:var(--font-display);font-size:19px;margin:0;font-weight:700;letter-spacing:.2px;}
  .row-head span{font-size:12px;color:var(--text-dim);}

  .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:16px;}
  .card{position:relative;height:124px;border-radius:10px;overflow:hidden;cursor:pointer;
    background:linear-gradient(135deg,#1c1c22,#0d0d10);border:1px solid var(--line);
    opacity:0;transform:translateY(10px) scale(.98);
    animation:cardIn .45s ease forwards;
    transition:transform .25s ease, box-shadow .25s ease, border-color .25s;}
  @keyframes cardIn{to{opacity:1;transform:translateY(0) scale(1);}}
  .card::before{content:'';position:absolute;inset:-1px;border-radius:11px;padding:1px;
    background:conic-gradient(from 0deg, var(--red), var(--spark), var(--red));
    -webkit-mask:linear-gradient(#000 0 0) content-box, linear-gradient(#000 0 0);
    -webkit-mask-composite:xor; mask-composite:exclude;
    opacity:0; transition:opacity .25s; animation:spin 3s linear infinite; animation-play-state:paused;}
  @keyframes spin{to{transform:rotate(360deg);}}
  .card:hover{transform:scale(1.045);box-shadow:0 14px 34px rgba(0,0,0,.65);}
  .card:hover::before{opacity:1;animation-play-state:running;}
  .card .thumb{position:absolute;inset:0;background-size:cover;background-position:center;opacity:.92;
    transition:transform .3s ease;}
  .card:hover .thumb{transform:scale(1.06);}
  .card .fade{position:absolute;inset:0;background:linear-gradient(to top,rgba(0,0,0,.88),transparent 60%);}
  .card .title{position:absolute;left:11px;right:11px;bottom:9px;font-size:13px;font-weight:600;
    text-shadow:0 2px 6px rgba(0,0,0,.8);
    display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;}
  .card .play{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;
    opacity:0;transition:.2s;background:rgba(0,0,0,.25);}
  .card:hover .play{opacity:1;}
  .card .play svg{width:38px;height:38px;filter:drop-shadow(0 2px 10px rgba(0,0,0,.8));}

  .card .actor-tag{position:absolute;left:11px;top:9px;font-size:10px;font-weight:600;
    background:rgba(0,0,0,.55);backdrop-filter:blur(4px);padding:3px 8px;border-radius:20px;
    color:var(--spark);letter-spacing:.3px;max-width:calc(100% - 22px);overflow:hidden;
    text-overflow:ellipsis;white-space:nowrap;}

  .filter-row{display:flex;flex-wrap:wrap;gap:8px;margin:0 0 22px;}
  .chip{font-size:12px;font-weight:600;padding:7px 14px;border-radius:20px;cursor:pointer;
    border:1px solid var(--line);background:var(--panel2);color:var(--text-dim);transition:.15s;
    font-family:var(--font-body);white-space:nowrap;}
  .chip:hover{color:var(--text);border-color:rgba(255,255,255,.25);}
  .chip.active{background:linear-gradient(135deg,var(--red),#c8102e);color:#fff;border-color:transparent;
    box-shadow:0 4px 14px -4px rgba(255,31,66,.6);}

  .empty-hint,.err-hint{color:var(--text-dim);font-size:13px;padding:26px;border:1px dashed var(--line);
    border-radius:10px;text-align:center;}
  .skeleton-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:16px;}
  .skel{height:124px;border-radius:10px;background:linear-gradient(100deg,#16161a 30%,#1f1f25 50%,#16161a 70%);
    background-size:250% 100%;animation:shimmer 1.4s ease-in-out infinite;}
  @keyframes shimmer{0%{background-position:200% 0;}100%{background-position:-200% 0;}}

  @media (max-width:640px){
    .nav{padding:12px 16px;}
    .content{padding:18px 16px 60px;}
    .grid,.skeleton-grid{grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px;}
    .card,.skel{height:96px;}
  }
</style>
</head>
<body>

<div class="nav">
  <div class="brand"><span class="v">⚡</span><b class="shine">BLITZ</b></div>
  <a class="admin-link" href="admin.html">Admin</a>
</div>

<div class="content">
  <div class="row-head">
    <h2 id="rowHeading">All Videos</h2>
    <span id="countLabel"></span>
  </div>
  <div id="filterRow" class="filter-row" style="display:none;"></div>
  <div id="loading" class="skeleton-grid">
    <div class="skel"></div><div class="skel"></div><div class="skel"></div><div class="skel"></div>
    <div class="skel"></div><div class="skel"></div><div class="skel"></div><div class="skel"></div>
  </div>
  <div id="grid" class="grid" style="display:none;"></div>
  <div id="emptyHint" class="empty-hint" style="display:none;">No videos yet. Add one from the Admin panel.</div>
  <div id="errHint" class="err-hint" style="display:none;">Couldn't load videos. Check back in a bit.</div>
</div>

<script>
(async function(){
  const grid = document.getElementById('grid');
  const loading = document.getElementById('loading');
  const emptyHint = document.getElementById('emptyHint');
  const errHint = document.getElementById('errHint');
  const countLabel = document.getElementById('countLabel');
  const filterRow = document.getElementById('filterRow');
  const rowHeading = document.getElementById('rowHeading');

  let allVideos = [];
  let activeActor = 'All';

  function escapeHtml(s){
    return (s||'').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
  }

  // Resolve the thumbnail to show: explicit thumb > actor's default photo > generic placeholder
  function resolveThumb(v){
    if(v.thumb) return v.thumb;
    if(v.actor && window.getActorThumb){
      const actorPic = window.getActorThumb(v.actor);
      if(actorPic) return actorPic;
    }
    return '';
  }

  function renderGrid(videos){
    if(!videos.length){
      grid.style.display = 'none';
      grid.innerHTML = '';
      emptyHint.style.display = 'block';
      emptyHint.textContent = activeActor === 'All'
        ? 'No videos yet. Add one from the Admin panel.'
        : `No videos found for "${activeActor}".`;
      return;
    }
    emptyHint.style.display = 'none';
    grid.style.display = 'grid';
    grid.innerHTML = videos.map((v,i) => {
      const thumbUrl = resolveThumb(v);
      return `
      <div class="card" data-id="${escapeHtml(v.id)}" style="animation-delay:${Math.min(i*45,450)}ms;">
        <div class="thumb" style="${thumbUrl ? `background-image:url('${escapeHtml(thumbUrl)}')` : `background:linear-gradient(135deg,#2a2a30,#111);`}"></div>
        <div class="fade"></div>
        ${v.actor ? `<div class="actor-tag">🎭 ${escapeHtml(v.actor)}</div>` : ''}
        <div class="play"><svg viewBox="0 0 24 24" fill="white"><path d="M8 5v14l11-7z"/></svg></div>
        <div class="title">${escapeHtml(v.title)}</div>
      </div>
    `;
    }).join('');

    grid.querySelectorAll('.card').forEach(card=>{
      card.addEventListener('click', ()=>{
        window.location.href = 'player.html?id=' + encodeURIComponent(card.dataset.id);
      });
    });
  }

  function applyFilter(actor){
    activeActor = actor;
    filterRow.querySelectorAll('.chip').forEach(c=>{
      c.classList.toggle('active', c.dataset.actor === actor);
    });
    rowHeading.textContent = actor === 'All' ? 'All Videos' : actor;
    const filtered = actor === 'All' ? allVideos : allVideos.filter(v => (v.actor||'').trim() === actor);
    countLabel.textContent = filtered.length + (filtered.length===1 ? ' video' : ' videos');
    renderGrid(filtered);
  }

  function renderFilters(videos){
    const actors = [...new Set(videos.map(v => (v.actor||'').trim()).filter(Boolean))].sort();
    if(!actors.length){
      filterRow.style.display = 'none';
      return;
    }
    filterRow.style.display = 'flex';
    const chips = ['All', ...actors];
    filterRow.innerHTML = chips.map(a =>
      `<button class="chip${a==='All' ? ' active' : ''}" data-actor="${escapeHtml(a)}">${escapeHtml(a)}</button>`
    ).join('');
    filterRow.querySelectorAll('.chip').forEach(chip=>{
      chip.addEventListener('click', ()=> applyFilter(chip.dataset.actor));
    });
  }

  try{
    const res = await fetch('/api/videos');
    if(!res.ok) throw new Error('fetch failed');
    const videos = await res.json();
    allVideos = videos;

    loading.style.display = 'none';
    countLabel.textContent = videos.length + (videos.length===1 ? ' video' : ' videos');

    if(!videos.length){
      emptyHint.style.display = 'block';
      return;
    }

    renderFilters(videos);
    renderGrid(videos);
  }catch(e){
    loading.style.display = 'none';
    errHint.style.display = 'block';
  }
})();
</script>
</body>
</html>
