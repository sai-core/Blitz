<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>BLITZ Admin</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;700&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@500&display=swap" rel="stylesheet">
<script src="actors-config.js"></script>
<style>
  :root{
    --bg:#08080b; --panel:#131318; --panel2:#1a1a20;
    --red:#ff1f42; --spark:#ffd400; --text:#f5f5f7; --text-dim:#8c8c94; --line:rgba(255,255,255,.09);
    --font-display:'Space Grotesk',sans-serif; --font-body:'Inter',"Helvetica Neue",Arial,sans-serif;
    --font-mono:'JetBrains Mono',monospace;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;min-height:100%;color:var(--text);font-family:var(--font-body);
    background:radial-gradient(800px 460px at 10% -10%, rgba(255,31,66,.10), transparent 60%), var(--bg);}
  .nav{display:flex;align-items:center;justify-content:space-between;padding:16px 28px;
    background:rgba(9,9,11,.8);backdrop-filter:blur(14px);border-bottom:1px solid var(--line);}
  .brand{display:flex;align-items:center;gap:6px;font-family:var(--font-display);font-weight:700;
    font-size:20px;letter-spacing:.5px;text-decoration:none;color:var(--text);}
  .brand .v{color:var(--red);filter:drop-shadow(0 0 6px rgba(255,31,66,.7));}
  .home-link{color:var(--text-dim);font-size:13px;text-decoration:none;border:1px solid var(--line);
    padding:8px 14px;border-radius:7px;transition:.15s;font-weight:500;}
  .home-link:hover{color:var(--text);background:rgba(255,255,255,.07);border-color:rgba(255,255,255,.18);}

  .wrap{max-width:680px;margin:0 auto;padding:36px 20px 60px;}
  h2{font-family:var(--font-display);font-size:18px;margin:0 0 18px;font-weight:700;letter-spacing:.2px;}
  .card{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:24px;margin-bottom:20px;
    box-shadow:0 20px 40px -20px rgba(0,0,0,.5);}
  .field{margin-bottom:15px;}
  .field label{display:block;font-family:var(--font-mono);font-size:11px;color:var(--text-dim);
    margin-bottom:7px;font-weight:500;text-transform:uppercase;letter-spacing:.6px;}
  .field input{width:100%;padding:12px 13px;border-radius:8px;border:1px solid var(--line);
    background:var(--panel2);color:var(--text);font-size:14px;outline:none;transition:border-color .15s, box-shadow .15s;
    font-family:var(--font-body);}
  .field input:focus{border-color:var(--red);box-shadow:0 0 0 3px rgba(255,31,66,.15);}
  .btn{background:rgba(255,255,255,.08);color:var(--text);border:1px solid var(--line);
    padding:11px 18px;border-radius:8px;font-size:13px;font-weight:600;cursor:pointer;transition:.15s;
    font-family:var(--font-body);}
  .btn:hover{background:rgba(255,255,255,.16);}
  .btn.primary{background:linear-gradient(135deg,var(--red),#c8102e);border-color:transparent;
    box-shadow:0 8px 20px -6px rgba(255,31,66,.5);}
  .btn.primary:hover{filter:brightness(1.1);}
  .btn:disabled{opacity:.5;cursor:not-allowed;}
  .btn-row{display:flex;gap:10px;align-items:center;flex-wrap:wrap;}
  .msg{font-size:13px;margin-top:10px;min-height:18px;}
  .msg.ok{color:#4ade80;}
  .msg.err{color:var(--red);}

  .thumb-actions{display:flex;gap:8px;margin-top:8px;flex-wrap:wrap;}
  .thumb-preview{margin-top:10px;width:100%;max-height:180px;object-fit:cover;border-radius:8px;
    border:1px solid var(--line);display:none;background:#000;}
  .thumb-preview.show{display:block;}
  .seek-row-mini{display:flex;align-items:center;gap:8px;margin-top:8px;}
  .seek-row-mini input[type=range]{flex:1;accent-color:var(--red);}
  .seek-row-mini span{font-family:var(--font-mono);font-size:11px;color:var(--text-dim);min-width:54px;text-align:right;}

  .list{display:flex;flex-direction:column;gap:8px;}
  .row{display:flex;align-items:center;justify-content:space-between;gap:10px;
    padding:11px 13px;background:var(--panel2);border-radius:8px;border:1px solid var(--line);
    transition:border-color .15s;}
  .row:hover{border-color:rgba(255,255,255,.2);}
  .row .info{overflow:hidden;min-width:0;}
  .row .t{font-size:13px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
  .row .a{font-size:11px;color:var(--text-dim);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;margin-top:2px;font-family:var(--font-mono);}
  .row .actions{display:flex;gap:4px;flex-shrink:0;}
  .row .edit,.row .del{background:none;border:none;color:var(--text-dim);cursor:pointer;font-size:13px;flex-shrink:0;
    padding:4px 8px;border-radius:5px;transition:.15s;font-family:var(--font-body);}
  .row .edit:hover{color:var(--spark);background:rgba(255,212,0,.1);}
  .row .del:hover{color:var(--red);background:rgba(255,31,66,.1);}
  .empty{color:var(--text-dim);font-size:13px;padding:10px 0;}
  .edit-banner{display:none;align-items:center;justify-content:space-between;gap:10px;
    background:rgba(255,212,0,.1);border:1px solid rgba(255,212,0,.3);color:var(--spark);
    font-size:12px;font-weight:600;padding:9px 13px;border-radius:8px;margin-bottom:14px;}
  .edit-banner.show{display:flex;}
  .edit-banner button{background:none;border:none;color:var(--spark);text-decoration:underline;
    cursor:pointer;font-size:12px;font-family:var(--font-body);}
</style>
</head>
<body>

<div class="nav">
  <a class="brand" href="index.html"><span class="v">⚡</span>BLITZ Admin</a>
  <a class="home-link" href="index.html">← Home</a>
</div>

<div class="wrap">

  <div class="card" id="loginCard">
    <h2>Admin Login</h2>
    <div class="field">
      <label>Password</label>
      <input type="password" id="pwInput" placeholder="Enter admin password" autocomplete="current-password">
    </div>
    <div class="btn-row">
      <button class="btn primary" id="loginBtn">Unlock</button>
    </div>
    <div class="msg err" id="loginMsg"></div>
  </div>

  <div id="panel" style="display:none;">
    <div class="card">
      <h2 id="formHeading">Add Video</h2>
      <div class="edit-banner" id="editBanner">
        <span>Editing an existing video</span>
        <button type="button" id="cancelEditBtn">Cancel edit</button>
      </div>
      <div class="field">
        <label>Title</label>
        <input type="text" id="inTitle" placeholder="e.g. Class 10 - Physics Lecture 4">
      </div>
      <div class="field">
        <label>Actor (optional)</label>
        <input type="text" id="inActor" placeholder="e.g. Salman Khan">
        <div id="actorHint" style="font-size:11px;color:var(--text-dim);margin-top:6px;display:none;"></div>
      </div>
      <div class="field">
        <label>Video URL (.mp4 / direct link)</label>
        <input type="text" id="inUrl" placeholder="https://.../stream/xxx.mp4?raw=true">
      </div>
      <div class="field">
        <label>Thumbnail URL (optional — leave empty to auto-use actor's photo)</label>
        <input type="text" id="inThumb" placeholder="https://.../thumb.jpg">
        <div class="thumb-actions">
          <button class="btn" id="autoThumbBtn" type="button">Auto-grab from video (5s)</button>
          <button class="btn" id="pickTimeBtn" type="button">Pick time…</button>
          <button class="btn" id="clearThumbBtn" type="button">Clear</button>
        </div>
        <div class="seek-row-mini" id="timeRow" style="display:none;">
          <span style="font-family:var(--font-mono);font-size:11px;color:var(--text-dim);">Time</span>
          <input type="range" id="thumbTime" min="0" max="30" step="0.5" value="5">
          <span id="thumbTimeVal">5.0s</span>
          <button class="btn" id="captureNowBtn" type="button" style="padding:6px 10px;font-size:12px;">Capture</button>
        </div>
        <img id="thumbPreview" class="thumb-preview" alt="thumbnail preview">
      </div>
      <div class="btn-row">
        <button class="btn primary" id="addBtn">Add & Commit to GitHub</button>
      </div>
      <div class="msg" id="addMsg"></div>
    </div>

    <div class="card">
      <h2>Existing Videos</h2>
      <div class="list" id="list"></div>
    </div>
  </div>

</div>

<script>
(function(){
  let password = '';

  const loginCard = document.getElementById('loginCard');
  const panel = document.getElementById('panel');
  const pwInput = document.getElementById('pwInput');
  const loginBtn = document.getElementById('loginBtn');
  const loginMsg = document.getElementById('loginMsg');

  const inTitle = document.getElementById('inTitle');
  const inActor = document.getElementById('inActor');
  const inUrl = document.getElementById('inUrl');
  const inThumb = document.getElementById('inThumb');
  const addBtn = document.getElementById('addBtn');
  const addMsg = document.getElementById('addMsg');
  const list = document.getElementById('list');
  const formHeading = document.getElementById('formHeading');
  const editBanner = document.getElementById('editBanner');
  const cancelEditBtn = document.getElementById('cancelEditBtn');
  const actorHint = document.getElementById('actorHint');

  let editingId = null; // null = add mode, otherwise id of video being edited

  function refreshActorHint(){
    const actor = inActor.value.trim();
    const url = (window.getActorThumb && window.getActorThumb(actor)) || '';
    if(actor && url){
      actorHint.style.display = 'block';
      actorHint.textContent = '✓ Match found — this actor\'s default photo will be used if thumbnail is left empty.';
      actorHint.style.color = '#4ade80';
    } else if(actor){
      actorHint.style.display = 'block';
      actorHint.textContent = 'No default photo set for this actor yet (add it in actors-config.js).';
      actorHint.style.color = 'var(--text-dim)';
    } else {
      actorHint.style.display = 'none';
    }
  }
  inActor.addEventListener('input', refreshActorHint);

  function resetForm(){
    editingId = null;
    inTitle.value = ''; inActor.value = ''; inUrl.value = ''; inThumb.value = '';
    thumbPreview.removeAttribute('src');
    thumbPreview.classList.remove('show');
    timeRow.style.display = 'none';
    actorHint.style.display = 'none';
    formHeading.textContent = 'Add Video';
    addBtn.textContent = 'Add & Commit to GitHub';
    editBanner.classList.remove('show');
    addMsg.className = 'msg';
    addMsg.textContent = '';
  }

  cancelEditBtn.addEventListener('click', resetForm);

  const autoThumbBtn = document.getElementById('autoThumbBtn');
  const pickTimeBtn = document.getElementById('pickTimeBtn');
  const clearThumbBtn = document.getElementById('clearThumbBtn');
  const timeRow = document.getElementById('timeRow');
  const thumbTime = document.getElementById('thumbTime');
  const thumbTimeVal = document.getElementById('thumbTimeVal');
  const captureNowBtn = document.getElementById('captureNowBtn');
  const thumbPreview = document.getElementById('thumbPreview');

  function escapeHtml(s){
    return (s||'').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
  }

  // ---------- Server-side password verification (real auth) ----------
  async function loadList(){
    list.innerHTML = '<div class="empty">Loading…</div>';
    try{
      const res = await fetch('/api/videos');
      const videos = await res.json();
      if(!videos.length){
        list.innerHTML = '<div class="empty">No videos yet.</div>';
        return;
      }
      list.innerHTML = videos.map(v => `
        <div class="row" data-id="${escapeHtml(v.id)}">
          <div class="info">
            <div class="t">${escapeHtml(v.title)}</div>
            ${v.actor ? `<div class="a">🎭 ${escapeHtml(v.actor)}</div>` : ''}
          </div>
          <div class="actions">
            <button class="edit">Edit</button>
            <button class="del">Delete</button>
          </div>
        </div>
      `).join('');

      list.querySelectorAll('.edit').forEach(btn=>{
        btn.addEventListener('click', (e)=>{
          const row = e.target.closest('.row');
          const id = row.dataset.id;
          const v = videos.find(x => x.id === id);
          if(!v) return;
          editingId = id;
          inTitle.value = v.title || '';
          inActor.value = v.actor || '';
          inUrl.value = v.url || '';
          inThumb.value = v.thumb || '';
          if(v.thumb){
            thumbPreview.src = v.thumb;
            thumbPreview.classList.add('show');
          } else {
            thumbPreview.removeAttribute('src');
            thumbPreview.classList.remove('show');
          }
          refreshActorHint();
          formHeading.textContent = 'Edit Video';
          addBtn.textContent = 'Save Changes to GitHub';
          editBanner.classList.add('show');
          addMsg.className = 'msg';
          addMsg.textContent = '';
          window.scrollTo({ top: 0, behavior: 'smooth' });
        });
      });

      list.querySelectorAll('.del').forEach(btn=>{
        btn.addEventListener('click', async (e)=>{
          const row = e.target.closest('.row');
          const id = row.dataset.id;
          if(!confirm('Delete this video?')) return;
          btn.disabled = true;
          btn.textContent = 'Deleting…';
          try{
            const res = await fetch('/api/delete-video', {
              method:'POST', headers:{'Content-Type':'application/json'},
              body: JSON.stringify({ password, id })
            });
            const data = await res.json();
            if(!res.ok) throw new Error(data.error || 'Failed');
            if(editingId === id) resetForm();
            loadList();
          }catch(e){
            alert('Delete failed: ' + e.message);
            btn.disabled = false;
            btn.textContent = 'Delete';
          }
        });
      });
    }catch(e){
      list.innerHTML = '<div class="empty">Couldn\'t load list.</div>';
    }
  }

  async function verifyPassword(pw){
    const res = await fetch('/api/verify-password', {
      method:'POST', headers:{'Content-Type':'application/json'},
      body: JSON.stringify({ password: pw })
    });
    return res.ok;
  }

  loginBtn.addEventListener('click', async ()=>{
    const pw = pwInput.value;
    if(!pw){ loginMsg.textContent = 'Enter a password.'; return; }
    loginBtn.disabled = true;
    loginMsg.textContent = 'Checking…';
    try{
      const ok = await verifyPassword(pw);
      if(!ok){
        loginMsg.textContent = 'Wrong password. Try again.';
        pwInput.select();
        return;
      }
      password = pw;
      loginCard.style.display = 'none';
      panel.style.display = 'block';
      loginMsg.textContent = '';
      loadList();
    }catch(e){
      loginMsg.textContent = 'Network error: ' + e.message;
    }finally{
      loginBtn.disabled = false;
    }
  });
  pwInput.addEventListener('keydown', e=>{ if(e.key==='Enter') loginBtn.click(); });

  // ---------- Thumbnail auto-grab from video (browser-side, safe) ----------
  let probeVideo = null;
  function ensureProbe(){
    if(probeVideo) return probeVideo;
    probeVideo = document.createElement('video');
    probeVideo.crossOrigin = 'anonymous';
    probeVideo.muted = true;
    probeVideo.playsInline = true;
    probeVideo.preload = 'auto';
    return probeVideo;
  }

  function seekVideoTo(v, t){
    return new Promise((resolve, reject)=>{
      const onSeeked = ()=>{ v.removeEventListener('seeked', onSeeked); resolve(); };
      v.addEventListener('seeked', onSeeked, { once:true });
      v.addEventListener('error', ()=>{ v.removeEventListener('seeked', onSeeked); reject(new Error('Video failed to load (CORS or invalid URL)')); }, { once:true });
      try{ v.currentTime = Math.max(0, Math.min(t, (v.duration || t) - 0.05)); }
      catch(e){ v.removeEventListener('seeked', onSeeked); reject(e); }
      setTimeout(()=>{ v.removeEventListener('seeked', onSeeked); reject(new Error('Seek timed out')); }, 15000);
    });
  }

  async function grabFrame(t){
    const url = inUrl.value.trim();
    if(!url){
      addMsg.className = 'msg err';
      addMsg.textContent = 'Enter video URL first.';
      return;
    }
    addMsg.className = 'msg';
    addMsg.textContent = `Grabbing frame at ${t.toFixed(1)}s…`;
    const v = ensureProbe();
    v.src = url;
    try{
      await new Promise((resolve, reject)=>{
        const ok = ()=>{ cleanup(); resolve(); };
        const fail = ()=>{ cleanup(); reject(new Error('Video failed to load (CORS or invalid URL)')); };
        const cleanup = ()=>{
          v.removeEventListener('loadeddata', ok);
          v.removeEventListener('error', fail);
        };
        v.addEventListener('loadeddata', ok, { once:true });
        v.addEventListener('error', fail, { once:true });
        v.load();
        setTimeout(()=>{ cleanup(); reject(new Error('Load timed out')); }, 20000);
      });
      await seekVideoTo(v, t);
      // wait one frame so the canvas isn't black on some browsers
      await new Promise(r => requestAnimationFrame(()=>requestAnimationFrame(r)));
      const w = v.videoWidth || 320, h = v.videoHeight || 180;
      const c = document.createElement('canvas');
      // keep it small — 640px wide is plenty for a grid card
      const targetW = 640;
      const scale = targetW / w;
      c.width = targetW;
      c.height = Math.round(h * scale);
      const ctx = c.getContext('2d');
      ctx.drawImage(v, 0, 0, c.width, c.height);
      const dataUrl = c.toDataURL('image/jpeg', 0.82);
      inThumb.value = dataUrl;
      thumbPreview.src = dataUrl;
      thumbPreview.classList.add('show');
      addMsg.className = 'msg ok';
      addMsg.textContent = `Captured at ${t.toFixed(1)}s (${c.width}×${c.height}).`;
    }catch(e){
      addMsg.className = 'msg err';
      addMsg.textContent = 'Auto-thumbnail failed: ' + e.message + ' — type a URL manually instead.';
    }finally{
      // free memory
      try{ v.removeAttribute('src'); v.load(); }catch(_){}
    }
  }

  autoThumbBtn.addEventListener('click', ()=> grabFrame(parseFloat(thumbTime.value) || 5));
  pickTimeBtn.addEventListener('click', ()=>{
    timeRow.style.display = timeRow.style.display === 'none' ? 'flex' : 'none';
  });
  thumbTime.addEventListener('input', ()=>{ thumbTimeVal.textContent = parseFloat(thumbTime.value).toFixed(1) + 's'; });
  captureNowBtn.addEventListener('click', ()=> grabFrame(parseFloat(thumbTime.value) || 5));
  clearThumbBtn.addEventListener('click', ()=>{
    inThumb.value = '';
    thumbPreview.removeAttribute('src');
    thumbPreview.classList.remove('show');
  });

  // ---------- Add / Save video ----------
  addBtn.addEventListener('click', async ()=>{
    const title = inTitle.value.trim();
    const actor = inActor.value.trim();
    const url = inUrl.value.trim();
    const thumb = inThumb.value.trim();
    if(!title || !url){
      addMsg.className = 'msg err';
      addMsg.textContent = 'Title and video URL are required.';
      return;
    }
    const isEdit = !!editingId;
    addBtn.disabled = true;
    addMsg.className = 'msg';
    addMsg.textContent = isEdit ? 'Saving changes to GitHub…' : 'Committing to GitHub…';
    try{
      const endpoint = isEdit ? '/api/edit-video' : '/api/add-video';
      const payload = isEdit
        ? { password, id: editingId, title, url, thumb, actor }
        : { password, title, url, thumb, actor };
      const res = await fetch(endpoint, {
        method:'POST', headers:{'Content-Type':'application/json'},
        body: JSON.stringify(payload)
      });
      const data = await res.json();
      if(!res.ok) throw new Error(data.error || 'Failed');
      const successText = isEdit ? 'Saved! Changes committed to GitHub.' : 'Added! Committed to GitHub.';
      resetForm();
      addMsg.className = 'msg ok';
      addMsg.textContent = successText;
      loadList();
    }catch(e){
      addMsg.className = 'msg err';
      addMsg.textContent = 'Error: ' + e.message + (e.message.toLowerCase().includes('password') ? ' — re-check your password.' : '');
    }finally{
      addBtn.disabled = false;
    }
  });
})();
</script>
</body>
</html>
