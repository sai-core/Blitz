<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1, user-scalable=no">
<title>BLITZ PLAYER</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#08080b; --panel:#151519; --red:#ff1f42; --spark:#ffd400; --text:#f5f5f7;
    --text-dim:#8c8c94; --line:rgba(255,255,255,.09);
    --font-display:'Space Grotesk',sans-serif; --font-body:'Inter',"Helvetica Neue",Arial,sans-serif;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
  html,body{margin:0;height:100%;background:var(--bg);color:var(--text);
    font-family:var(--font-body);overflow-x:hidden;}
  ::-webkit-scrollbar{width:10px;} ::-webkit-scrollbar-track{background:var(--bg);}
  ::-webkit-scrollbar-thumb{background:#28282f;border-radius:6px;}

  .nav{position:relative;z-index:50;display:flex;align-items:center;justify-content:space-between;
    padding:12px 28px;background:rgba(9,9,11,.8);backdrop-filter:blur(14px);border-bottom:1px solid var(--line);}
  .brand{display:flex;align-items:center;gap:6px;font-family:var(--font-display);font-weight:700;
    font-size:20px;letter-spacing:.5px;text-decoration:none;color:var(--text);}
  .brand .v{color:var(--red);font-size:24px;display:inline-block;animation:boltPulse 1.8s ease-in-out infinite;
    filter:drop-shadow(0 0 6px rgba(255,31,66,.7));}
  @keyframes boltPulse{
    0%,100%{transform:scale(1) rotate(0deg);filter:drop-shadow(0 0 4px rgba(255,31,66,.5));}
    45%{transform:scale(1.18) rotate(-6deg);filter:drop-shadow(0 0 12px rgba(255,212,0,.85));}
    55%{transform:scale(1.05) rotate(4deg);}
  }
  .back-link{color:var(--text-dim);font-size:13px;text-decoration:none;border:1px solid var(--line);
    padding:8px 14px;border-radius:7px;font-weight:500;transition:.15s;}
  .back-link:hover{color:var(--text);background:rgba(255,255,255,.07);border-color:rgba(255,255,255,.18);}

  .player-wrap{position:relative;}
  .player-wrap.fs-active{position:fixed;top:0;left:0;right:0;bottom:0;z-index:9999;
    background:#000;display:flex;flex-direction:column;}
  .player-wrap.fs-active .stage-outer{flex:1;min-height:0;padding-top:0;position:relative;}
  .player-wrap.fs-active .controls-bar{flex-shrink:0;}
  .player-wrap.fs-active .info-bar{display:none;}
  .player-wrap.fs-active .fs-hide{display:none !important;}

  .stage-outer{position:relative;width:100%;padding-top:56.25%;background:#000;}
  .stage{position:absolute;top:0;left:0;right:0;bottom:0;background:#000;overflow:hidden;}
  video{width:100%;height:100%;object-fit:contain;background:#000;display:block;
    transform-origin:center center;position:relative;z-index:1;transition:transform .12s ease-out;}

  .pan-btn{position:absolute;top:50%;transform:translateY(-50%);z-index:5;width:42px;height:42px;
    border-radius:50%;border:none;background:rgba(0,0,0,.5);color:#fff;display:none;
    align-items:center;justify-content:center;cursor:pointer;backdrop-filter:blur(4px);}
  .stage.zoomed .pan-btn{display:flex;}
  .pan-left{left:10px;} .pan-right{right:10px;}
  .pan-btn svg{width:22px;height:22px;}

  .zoom-row{display:none;align-items:center;gap:12px;padding:10px 4px 4px;border-top:1px solid var(--line);margin-top:10px;}
  .zoom-row.show{display:flex;}
  .zoom-row input[type=range]{flex:1;accent-color:var(--red);}
  .zoom-row .zoom-val{font-size:12px;color:var(--text-dim);min-width:44px;text-align:right;font-variant-numeric:tabular-nums;}
  .zoom-row .zoom-reset{font-size:11px;font-weight:700;color:var(--text-dim);background:rgba(255,255,255,.08);
    border:none;border-radius:5px;padding:6px 9px;cursor:pointer;}
  .zoom-row .zoom-reset:hover{color:var(--text);background:rgba(255,255,255,.16);}

  .info-bar{position:relative;z-index:8;padding:16px 20px;background:rgba(255,255,255,.06);
    backdrop-filter:blur(18px) saturate(160%);-webkit-backdrop-filter:blur(18px) saturate(160%);
    border-bottom:1px solid rgba(255,255,255,.08);}
  .info-bar h1{margin:0 0 4px;font-family:var(--font-display);font-size:clamp(16px,3.2vw,22px);font-weight:700;letter-spacing:.2px;}
  .info-bar p{margin:0;color:var(--text-dim);font-size:12.5px;}

  .center-toggle{position:absolute;top:0;left:0;right:0;bottom:0;z-index:4;display:flex;
    align-items:center;justify-content:center;cursor:pointer;background:transparent;border:none;}
  .center-toggle svg{width:64px;height:64px;opacity:0;transition:opacity .2s, transform .2s;
    filter:drop-shadow(0 4px 10px rgba(0,0,0,.6));}
  .center-toggle.flash svg{opacity:1;transform:scale(1.15);}
  .stage.is-paused .center-toggle svg{opacity:.9;}

  .spinner{position:absolute;top:0;left:0;right:0;bottom:0;z-index:6;display:none;
    align-items:center;justify-content:center;pointer-events:none;}
  .spinner.show{display:flex;}
  .spinner div{width:52px;height:52px;border-radius:50%;border:4px solid rgba(255,255,255,.15);
    border-top-color:var(--red);animation:spin .8s linear infinite;}
  @keyframes spin{to{transform:rotate(360deg);}}

  .err-box{position:absolute;top:0;left:0;right:0;bottom:0;z-index:7;display:none;flex-direction:column;
    align-items:center;justify-content:center;gap:10px;background:rgba(0,0,0,.85);text-align:center;padding:20px;}
  .err-box.show{display:flex;}
  .err-box b{font-size:16px;}
  .err-box span{color:var(--text-dim);font-size:13px;max-width:420px;}

  .controls-bar{position:relative;z-index:8;background:#0a0a0c;border-bottom:1px solid var(--line);padding:14px 20px 10px;}
  .seek-row{display:flex;align-items:center;gap:10px;margin-bottom:10px;}
  .time{font-size:12px;color:var(--text-dim);min-width:44px;text-align:center;font-variant-numeric:tabular-nums;}
  .seek-wrap{flex:1;position:relative;height:30px;display:flex;align-items:center;cursor:pointer;touch-action:none;}
  .seek-track{position:absolute;left:0;right:0;height:4px;border-radius:2px;background:rgba(255,255,255,.25);}
  .seek-buffer{position:absolute;left:0;height:4px;border-radius:2px;background:rgba(255,255,255,.4);width:0%;}
  .seek-fill{position:absolute;left:0;height:4px;border-radius:2px;background:var(--red);width:0%;transition:width .15s linear;}
  .seek-input{position:absolute;left:0;right:0;width:100%;margin:0;height:30px;opacity:0;cursor:pointer;touch-action:none;}
  .seek-thumb{position:absolute;top:50%;width:13px;height:13px;border-radius:50%;background:var(--red);
    transform:translate(-50%,-50%);left:0%;box-shadow:0 0 0 4px rgba(255,31,66,.22);pointer-events:none;transition:left .15s linear;}
  .seek-wrap.dragging .seek-fill,.seek-wrap.dragging .seek-thumb{transition:none;}

  .btn-row{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;}
  .btn-row .left,.btn-row .right{display:flex;align-items:center;gap:14px;}
  .icon-btn{background:none;border:none;color:var(--text);cursor:pointer;padding:6px;
    display:flex;align-items:center;justify-content:center;border-radius:50%;transition:.15s;}
  .icon-btn:hover{background:rgba(255,255,255,.12);}
  .icon-btn svg{width:26px;height:26px;}
  .icon-btn.small svg{width:20px;height:20px;}
  .vol-wrap{display:flex;align-items:center;gap:6px;}
  .vol-wrap input[type=range]{width:80px;accent-color:var(--red);}
  .speed-btn{font-size:13px;font-weight:700;background:rgba(255,255,255,.1);border:1px solid var(--line);
    padding:6px 10px;border-radius:5px;color:var(--text);cursor:pointer;}
  .speed-btn:hover{background:rgba(255,255,255,.18);}

  .msg-hint{padding:60px 20px;text-align:center;color:var(--text-dim);}

  @media (max-width:640px){
    .nav{padding:12px 16px;}
    .info-bar{padding:12px 16px;}
    .info-bar h1{font-size:16px;}
    .info-bar p{font-size:11px;}
    .controls-bar{padding:10px 14px 8px;}
    .vol-wrap input[type=range]{width:56px;}
  }
</style>
</head>
<body>

<div class="nav">
  <a class="brand" href="index.html"><span class="v">⚡</span>BLITZ</a>
  <a class="back-link" href="index.html">← All videos</a>
</div>

<div class="player-wrap" id="playerWrap">
<div class="stage-outer">
<div class="stage" id="stage">
  <video id="video" playsinline webkit-playsinline preload="metadata"></video>

  <button class="center-toggle" id="centerToggle">
    <svg id="centerIcon" viewBox="0 0 24 24" fill="white"><path d="M8 5v14l11-7z"/></svg>
  </button>

  <button class="pan-btn pan-left" id="panLeftBtn" title="Pan left">
    <svg viewBox="0 0 24 24" fill="white"><path d="M15 18l-6-6 6-6v12z"/></svg>
  </button>
  <button class="pan-btn pan-right" id="panRightBtn" title="Pan right">
    <svg viewBox="0 0 24 24" fill="white"><path d="M9 18l6-6-6-6v12z"/></svg>
  </button>

  <div class="spinner" id="spinner"><div></div></div>

  <div class="err-box" id="errBox">
    <b>Playback failed</b>
    <span>This stream link couldn't be played directly in-browser. It may require a Referer header, be region/CORS blocked, or the file may have expired.</span>
    <button class="btn primary" id="errRetry" style="margin-top:6px;background:var(--red);border:none;color:#fff;padding:9px 16px;border-radius:6px;font-weight:600;cursor:pointer;">Retry</button>
  </div>
</div>
</div>

<div class="info-bar" id="titleCard">
  <h1 id="npTitle">Loading…</h1>
  <p id="npSub"></p>
</div>

<div class="controls-bar" id="controls">
  <div class="seek-row">
    <span class="time" id="curTime">0:00</span>
    <div class="seek-wrap" id="seekWrap">
      <div class="seek-track"></div>
      <div class="seek-buffer" id="seekBuffer"></div>
      <div class="seek-fill" id="seekFill"></div>
      <div class="seek-thumb" id="seekThumb"></div>
      <input type="range" class="seek-input" id="seekInput" min="0" max="1000" value="0">
    </div>
    <span class="time" id="durTime">0:00</span>
  </div>

  <div class="btn-row" id="btnRow">
    <div class="left">
      <button class="icon-btn fs-hide" id="playBtn" title="Play/Pause (space)">
        <svg viewBox="0 0 24 24" fill="white"><path d="M8 5v14l11-7z"/></svg>
      </button>
      <button class="icon-btn small fs-hide" id="backBtn" title="Back 10s (←)">
        <svg viewBox="0 0 24 24" fill="white"><path d="M11 18V6l-8.5 6 8.5 6zm.5-6l8.5 6V6l-8.5 6z"/></svg>
      </button>
      <button class="icon-btn small fs-hide" id="fwdBtn" title="Forward 10s (→)">
        <svg viewBox="0 0 24 24" fill="white"><path d="M13 6v12l8.5-6L13 6zm-.5 6L4 6v12l8.5-6z"/></svg>
      </button>
      <div class="vol-wrap fs-hide">
        <button class="icon-btn small" id="muteBtn" title="Mute (m)">
          <svg id="volIcon" viewBox="0 0 24 24" fill="white"><path d="M3 10v4h4l5 5V5L7 10H3z"/></svg>
        </button>
        <input type="range" id="volInput" min="0" max="1" step="0.05" value="1">
      </div>
    </div>
    <div class="right">
      <button class="speed-btn fs-hide" id="speedBtn">1x</button>
      <button class="icon-btn small fs-hide" id="pipBtn" title="Picture in Picture">
        <svg viewBox="0 0 24 24" fill="white"><path d="M19 7H9a2 2 0 00-2 2v6a2 2 0 002 2h10a2 2 0 002-2V9a2 2 0 00-2-2zm-1 8h-6v-4h6v4zM3 5h12v2H3a0 0 0 000 0v10H1V5a2 2 0 012-2z"/></svg>
      </button>
      <button class="icon-btn small" id="zoomBtn" title="Zoom">
        <svg viewBox="0 0 24 24" fill="white"><path d="M15.5 14h-.79l-.28-.27a6.5 6.5 0 001.48-5.34C15.4 5.09 12.79 3 9.5 3S3.6 5.09 3.09 8.39A6.5 6.5 0 009.5 15a6.47 6.47 0 003.98-1.36l.27.28v.79l4.25 4.25c.41.41 1.08.41 1.49 0 .41-.41.41-1.08 0-1.49L15.5 14zm-6 0C7.01 14 5 11.99 5 9.5S7.01 5 9.5 5 14 7.01 14 9.5 11.99 14 9.5 14zM10 7H9v2H7v1h2v2h1v-2h2V9h-2z"/></svg>
      </button>
      <button class="icon-btn small fs-hide" id="fsBtn" title="Fullscreen (f)">
        <svg viewBox="0 0 24 24" fill="white"><path d="M7 14H5v5h5v-2H7v-3zm-2-4h2V7h3V5H5v5zm12 7h-3v2h5v-5h-2v3zM14 5v2h3v3h2V5h-5z"/></svg>
      </button>
    </div>
  </div>

  <div class="zoom-row" id="zoomRow">
    <span style="font-size:11px;color:var(--text-dim);white-space:nowrap;">Zoom</span>
    <input type="range" id="zoomInput" min="100" max="250" step="5" value="100">
    <span class="zoom-val" id="zoomVal">100%</span>
    <button class="zoom-reset" id="zoomResetBtn">Reset</button>
  </div>
</div>
</div>

<div id="notFound" class="msg-hint" style="display:none;">
  Video not found. <a href="index.html" style="color:var(--red);">Go back home</a>.
</div>

<script>
(async function(){
  const params = new URLSearchParams(location.search);
  const videoId = params.get('id');

  const video = document.getElementById('video');
  const stage = document.getElementById('stage');
  const spinner = document.getElementById('spinner');
  const errBox = document.getElementById('errBox');
  const errRetry = document.getElementById('errRetry');
  const centerToggle = document.getElementById('centerToggle');
  const centerIcon = document.getElementById('centerIcon');
  const npTitle = document.getElementById('npTitle');
  const npSub = document.getElementById('npSub');
  const playerWrap = document.getElementById('playerWrap');
  const notFound = document.getElementById('notFound');

  const playBtn = document.getElementById('playBtn');
  const backBtn = document.getElementById('backBtn');
  const fwdBtn = document.getElementById('fwdBtn');
  const muteBtn = document.getElementById('muteBtn');
  const volIcon = document.getElementById('volIcon');
  const volInput = document.getElementById('volInput');
  const speedBtn = document.getElementById('speedBtn');
  const fsBtn = document.getElementById('fsBtn');
  const zoomBtn = document.getElementById('zoomBtn');
  const zoomRow = document.getElementById('zoomRow');
  const zoomInput = document.getElementById('zoomInput');
  const zoomVal = document.getElementById('zoomVal');
  const zoomResetBtn = document.getElementById('zoomResetBtn');
  const panLeftBtn = document.getElementById('panLeftBtn');
  const panRightBtn = document.getElementById('panRightBtn');
  const pipBtn = document.getElementById('pipBtn');

  const curTime = document.getElementById('curTime');
  const durTime = document.getElementById('durTime');
  const seekWrap = document.getElementById('seekWrap');
  const seekFill = document.getElementById('seekFill');
  const seekBuffer = document.getElementById('seekBuffer');
  const seekThumb = document.getElementById('seekThumb');
  const seekInput = document.getElementById('seekInput');

  function fmt(s){
    if(!isFinite(s)) return '0:00';
    s = Math.floor(s);
    const h = Math.floor(s/3600), m = Math.floor((s%3600)/60), sec = s%60;
    return (h? h+':'+String(m).padStart(2,'0') : m) + ':' + String(sec).padStart(2,'0');
  }

  if(!videoId){
    playerWrap.style.display = 'none';
    notFound.style.display = 'block';
    return;
  }

  let item = null;
  try{
    const res = await fetch('/api/videos');
    const list = await res.json();
    item = list.find(v => v.id === videoId);
  }catch(e){}

  if(!item){
    playerWrap.style.display = 'none';
    notFound.style.display = 'block';
    return;
  }

  npTitle.textContent = item.title;
  npSub.textContent = new Date(item.addedAt).toLocaleDateString();
  video.src = item.url;
  spinner.classList.add('show');
  stage.classList.add('is-paused');
  video.volume = 1;

  // play/pause
  function togglePlay(){ video.paused ? video.play().catch(()=>{}) : video.pause(); }
  function flashIcon(playing){
    centerIcon.innerHTML = playing
      ? '<path d="M6 5h4v14H6zm8 0h4v14h-4z"/>'
      : '<path d="M8 5v14l11-7z"/>';
    centerToggle.classList.remove('flash'); void centerToggle.offsetWidth; centerToggle.classList.add('flash');
  }
  centerToggle.addEventListener('click', togglePlay);
  playBtn.addEventListener('click', togglePlay);
  video.addEventListener('play', ()=>{
    stage.classList.remove('is-paused');
    playBtn.innerHTML = '<svg viewBox="0 0 24 24" fill="white"><path d="M6 5h4v14H6zm8 0h4v14h-4z"/></svg>';
    flashIcon(true);
  });
  video.addEventListener('pause', ()=>{
    stage.classList.add('is-paused');
    playBtn.innerHTML = '<svg viewBox="0 0 24 24" fill="white"><path d="M8 5v14l11-7z"/></svg>';
    flashIcon(false);
  });
  video.addEventListener('waiting', ()=> spinner.classList.add('show'));
  video.addEventListener('playing', ()=> spinner.classList.remove('show'));
  video.addEventListener('canplay', ()=> spinner.classList.remove('show'));
  video.addEventListener('error', ()=>{
    spinner.classList.remove('show');
    errBox.classList.add('show');
  });
  errRetry.addEventListener('click', ()=>{
    errBox.classList.remove('show');
    spinner.classList.add('show');
    video.load();
    video.play().catch(()=>{});
  });

  backBtn.addEventListener('click', ()=> video.currentTime = Math.max(0, video.currentTime-10));
  fwdBtn.addEventListener('click', ()=> video.currentTime = Math.min(video.duration||1e9, video.currentTime+10));

  // seek bar
  function updateSeekUI(){
    if(isSeeking) return;
    const dur = video.duration || 0;
    const pct = dur ? (video.currentTime/dur)*100 : 0;
    seekFill.style.width = pct+'%';
    seekThumb.style.left = pct+'%';
    seekInput.value = Math.round(pct*10);
    curTime.textContent = fmt(video.currentTime);
    durTime.textContent = fmt(dur);
    if(video.buffered.length){
      const end = video.buffered.end(video.buffered.length-1);
      seekBuffer.style.width = (dur? (end/dur)*100:0)+'%';
    }
  }
  video.addEventListener('timeupdate', updateSeekUI);
  video.addEventListener('loadedmetadata', updateSeekUI);
  video.addEventListener('progress', updateSeekUI);
  let dragPct = null;
  function seekVisualFromInput(){
    const pct = seekInput.value/10;
    dragPct = pct;
    seekFill.style.width = pct+'%';
    seekThumb.style.left = pct+'%';
    curTime.textContent = fmt((pct/100)*(video.duration||0));
  }
  seekInput.addEventListener('input', seekVisualFromInput);

  let isSeeking = false;
  function seekStart(){ isSeeking = true; seekWrap.classList.add('dragging'); }
  function seekEnd(){
    if(isSeeking && dragPct!==null){
      video.currentTime = (dragPct/100)*(video.duration||0);
      dragPct = null;
    }
    isSeeking = false;
    seekWrap.classList.remove('dragging');
  }
  ['pointerdown','touchstart','mousedown'].forEach(ev=> seekWrap.addEventListener(ev, seekStart, {passive:true}));
  ['pointerup','touchend','touchcancel','mouseup'].forEach(ev=>{
    seekWrap.addEventListener(ev, seekEnd, {passive:true});
    document.addEventListener(ev, ()=>{ if(isSeeking) seekEnd(); }, {passive:true});
  });

  // volume
  volInput.addEventListener('input', ()=>{
    video.volume = volInput.value;
    video.muted = video.volume==0;
    updateVolIcon();
  });
  muteBtn.addEventListener('click', ()=>{ video.muted = !video.muted; updateVolIcon(); });
  function updateVolIcon(){
    const muted = video.muted || video.volume==0;
    volIcon.innerHTML = muted
      ? '<path d="M16.5 12A4.5 4.5 0 0014 8v1.6l2.4 2.4h.1zM19 12c0 .9-.2 1.7-.5 2.5l1.5 1.5A8.9 8.9 0 0021 12c0-4-2.5-7.4-6-8.8v2.1c2.4 1.2 4 3.7 4 6.7zM4.3 3L3 4.3 7.7 9H3v6h4l5 5v-6.7l4.3 4.3c-.6.5-1.4.9-2.3 1.2v2.1c1.4-.3 2.6-.9 3.7-1.8l1.7 1.7 1.3-1.3L4.3 3z"/>'
      : '<path d="M3 10v4h4l5 5V5L7 10H3z"/><path d="M16.5 12A4.5 4.5 0 0014 8v8a4.5 4.5 0 002.5-4z"/>';
  }

  // speed
  const speeds = [1,1.25,1.5,1.75,2,0.5,0.75];
  let speedIdx = 0;
  speedBtn.addEventListener('click', ()=>{
    speedIdx = (speedIdx+1) % speeds.length;
    video.playbackRate = speeds[speedIdx];
    speedBtn.textContent = speeds[speedIdx]+'x';
  });

  // fullscreen
  function getFsElement(){
    return document.fullscreenElement || document.webkitFullscreenElement ||
           document.mozFullScreenElement || document.msFullscreenElement;
  }
  function requestFs(el){
    (el.requestFullscreen || el.webkitRequestFullscreen ||
     el.mozRequestFullScreen || el.msRequestFullscreen).call(el);
  }
  function exitFs(){
    (document.exitFullscreen || document.webkitExitFullscreen ||
     document.mozCancelFullScreen || document.msExitFullscreen).call(document);
  }
  fsBtn.addEventListener('click', ()=>{
    try{ if(!getFsElement()) requestFs(playerWrap); else exitFs(); }catch(e){}
  });
  ['fullscreenchange','webkitfullscreenchange','mozfullscreenchange','MSFullscreenChange'].forEach(ev=>{
    document.addEventListener(ev, ()=>{
      playerWrap.classList.toggle('fs-active', getFsElement() === playerWrap);
    });
  });
  stage.addEventListener('dblclick', ()=> fsBtn.click());

  // zoom + pan
  let zoomLevel = 1, panX = 0;
  function clampPan(){
    const maxPan = (stage.clientWidth * (zoomLevel - 1)) / 2;
    panX = Math.max(-maxPan, Math.min(maxPan, panX));
  }
  function applyZoom(){
    clampPan();
    video.style.transform = `scale(${zoomLevel}) translateX(${panX / zoomLevel}px)`;
    stage.classList.toggle('zoomed', zoomLevel > 1.001);
  }
  zoomBtn.addEventListener('click', ()=> zoomRow.classList.toggle('show'));
  zoomInput.addEventListener('input', ()=>{
    zoomLevel = zoomInput.value / 100;
    zoomVal.textContent = zoomInput.value + '%';
    applyZoom();
  });
  zoomResetBtn.addEventListener('click', ()=>{
    zoomLevel = 1; panX = 0;
    zoomInput.value = 100; zoomVal.textContent = '100%';
    applyZoom();
  });
  panLeftBtn.addEventListener('click', ()=>{ panX += 60; applyZoom(); });
  panRightBtn.addEventListener('click', ()=>{ panX -= 60; applyZoom(); });
  window.addEventListener('resize', applyZoom);

  // pip
  pipBtn.addEventListener('click', ()=>{
    if(document.pictureInPictureElement) document.exitPictureInPicture();
    else if(document.pictureInPictureEnabled && video.readyState>0) video.requestPictureInPicture().catch(()=>{});
  });

  // keyboard shortcuts
  document.addEventListener('keydown', (e)=>{
    switch(e.code){
      case 'Space': e.preventDefault(); togglePlay(); break;
      case 'ArrowLeft': video.currentTime = Math.max(0, video.currentTime-10); break;
      case 'ArrowRight': video.currentTime = Math.min(video.duration||1e9, video.currentTime+10); break;
      case 'ArrowUp': e.preventDefault(); video.volume = Math.min(1, video.volume+0.1); volInput.value=video.volume; updateVolIcon(); break;
      case 'ArrowDown': e.preventDefault(); video.volume = Math.max(0, video.volume-0.1); volInput.value=video.volume; updateVolIcon(); break;
      case 'KeyF': fsBtn.click(); break;
      case 'KeyM': muteBtn.click(); break;
    }
  });
})();
</script>
</body>
</html>
